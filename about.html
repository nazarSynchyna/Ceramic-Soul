<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About</title>
    <meta name="author" content="Synchyna Nazar">
    <meta name="description" content="Website for Ceramic soul brand">
    <script src="https://kit.fontawesome.com/55a90cc2db.js" crossorigin="anonymous"></script>
    <link rel="icon" type="image/png" href="favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;1,400&display=swap"
        rel="stylesheet">
</head>

<body>
    <section class="about">
        <div class="container">
            <div class="header">
                <div class="header__menu">
                    <div class="header__menu-close">
                        <span></span>
                        <span></span>
                    </div>
                    <nav class="header__menu-nav">
                        <ul>
                            <li><a href="#" class="header__menu-link">catalog</a></li>
                            <li><a href="#" class="header__menu-link">blog</a></li>
                            <li><a href="#" class="header__menu-link">about</a></li>
                        </ul>
                    </nav>
                </div>
                <div class="header__top">
                    <div class="burger">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                    <a href="#" class="header__logo"><img src="/src/logo/logo.png" alt="logo"></a>
                    <div class="header__icons">
                        <a href="#"><span><i class="fa-solid fa-magnifying-glass"></i></span></a>
                        <a href="#"><span><i class="fa-solid fa-bag-shopping"></i></span></a>
                    </div>
                </div>
                <nav class="header__nav">
                    <ul>
                        <li><a href="#" class="header__link">catalog</a></li>
                        <li><a href="#" class="header__link">blog</a></li>
                        <li><a href="#" class="header__link">about</a></li>
                    </ul>
                </nav>
            </div>
            
        </div>
    </section>
    <section class="touch">
        <div class="container">
            <h2 class="title-h2">get in touch</h2>
            <div class="pure-g touch__wrapper">
                <div class="pure-u-1 .pure-u-xl-1-2 .pure-u-xxl-2-5 touch__col">
                    <img src="/src/img/form/tea.jpg" alt="tea" class="touch__img">
                </div>
                <div class="pure-u-1 .pure-u-xl-1-2 .pure-u-xxl-3-5 touch__col">
                    <form class="touch__form" action="#">
                        <fieldset class="touch__fieldset">
                            <div class="touch__input-block">
                                <label class="touch__label" for="name">Name</label>
                                <input class="touch__input" type="text" id="name" name="name" placeholder="Name" required>
                            </div>
                            <div class="touch__input-block">
                                <label class="touch__label" for="Email">Email</label>
                                <input class="touch__input" type="email" id="email" name="email" placeholder="Email"
                                    required>
                            </div>
                        </fieldset>
                        <label class="touch__label" for="question">Your question</label>
                        <textarea class="touch__textarea" name="question" id="question" placeholder="Question"
                            required></textarea>
                        <label class="touch__label touch__check-block" for="checkbox">
                            <input class="touch__checkbox" type="checkbox" id="checkbox" required>
                            I agree with the <a href="#">terms</a></label>
                        <button class="btn-send touch__btn">send request</button>
                    </form>
                </div>
            </div>
            <img src="/src/img/form/vase.png" alt="vase" class="touch__decor">
        </div>
    </section>
    <footer class="footer footer__spaced">
        <div class="container">
            <div class="footer__wrapper">
                <div class="footer__newsletter">
                    <h2 class="title-footer footer__header">newsletter</h2>
                    <div class="footer__text footer__text_spaced">Keep up to date with news and promotions</div>
                    <form class="footer__form " action="#">
                        <input placeholder="Enter your e-mail" type="email" class="footer__input" required />
                        <label class="footer__check-block" for="footer__checkbox">
                            <input class="footer__checkbox" type="checkbox" id="footer__checkbox" required>
                            I agree with the <a href="#">terms</a></label>
                        <button class="btn-submit footer__form-btn">submit</button>
                    </form>
                </div>
                <div class="footer__columns">
                    <div class="footer__column">
                        <h2 class="title-footer footer__header">discover</h2>
                        <nav class="footer__nav">
                            <ul>
                                <li><a href="#" class="footer__link">About Us</a></li>
                                <li><a href="#" class="footer__link">Blog</a></li>
                            </ul>
                        </nav>
                    </div>
                    <div class="footer__column">
                        <h2 class="title-footer footer__header">shopping</h2>
                        <nav class="footer__nav">
                            <ul>
                                <li><a href="#" class="footer_link">Catalog</a></li>
                            </ul>
                        </nav>
                    </div>
                    <div class="footer__column">
                        <h2 class="title-footer footer__header">information</h2>
                        <nav class="footer__nav">
                            <ul>
                                <li><a href="#" class="footer__link">Terms and Conditions</a></li>
                            </ul>
                        </nav>
                    </div>
                </div>
                <div class="footer__social">
                    <h2 class="title-footer footer__header">follow us</h2>
                    <div class="footer__social-block">
                        <a href="#" class="footer__social-link"><i class="fa-brands fa-facebook"></i></a>
                        <a href="#" class="footer__social-link"><i class="fa-brands fa-instagram"></i></a>
                        <a href="#" class="footer__social-link"><i class="fa-brands fa-pinterest"></i></a>
                    </div>
                </div>
            </div>
            <div class="footer__copyright">
                © Copyright 2025, Ceramic soul
            </div>
        </div>
    </footer>
    <script type="module" src="/src/js/script.js"></script>
</body>
